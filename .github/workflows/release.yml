name: Release Beta APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g., v1.0.0-beta1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Beta APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Prepare Environment Files
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Configure Signing Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PWD: ${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_PWD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: |
          KEYSTORE_FILE="${{ github.workspace }}/my-upload-key.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from secrets.KEYSTORE_BASE64..."
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${STORE_PWD}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${KEY_PWD}" >> $GITHUB_ENV
            echo "Using user-provided release keystore."
          else
            echo "::warning::KEYSTORE_BASE64 secret was not found! Creating a temporary Beta keystore..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "androidbeta" \
              -keypass "androidbeta" \
              -dname "CN=BetaRelease, OU=UthoSajib, O=App, L=Dhaka, S=Dhaka, C=BD"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV
            echo "STORE_PASSWORD=androidbeta" >> $GITHUB_ENV
            echo "KEY_PASSWORD=androidbeta" >> $GITHUB_ENV
            echo "Generated temporary beta keystore."
          fi

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Prepare Beta APK Artifact
        id: apk_prep
        run: |
          RAW_TAG="${{ github.ref_name }}"
          if [ -z "$RAW_TAG" ] || [ "$RAW_TAG" = "main" ] || [ "$RAW_TAG" = "master" ]; then
            RAW_TAG="${{ inputs.tag_name }}"
          fi
          if [ -z "$RAW_TAG" ]; then
            RAW_TAG="v1.0.0-beta"
          fi
          
          # Find generated APK
          SOURCE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$SOURCE_APK" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi
          
          OUTPUT_APK="UthoSajib-${RAW_TAG}.apk"
          cp "$SOURCE_APK" "$OUTPUT_APK"
          echo "apk_path=$OUTPUT_APK" >> $GITHUB_OUTPUT
          echo "tag_name=$RAW_TAG" >> $GITHUB_OUTPUT
          echo "Built signed release APK: $OUTPUT_APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk_prep.outputs.tag_name }}-apk
          path: ${{ steps.apk_prep.outputs.apk_path }}
          retention-days: 30

      - name: Publish GitHub Beta Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag_name != ''
        with:
          tag_name: ${{ steps.apk_prep.outputs.tag_name }}
          name: "Beta Release ${{ steps.apk_prep.outputs.tag_name }}"
          prerelease: true
          draft: false
          generate_release_notes: true
          files: |
            ${{ steps.apk_prep.outputs.apk_path }}

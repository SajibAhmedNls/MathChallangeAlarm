name: Production Release

# Version scheme: <year>.<month>.<patch>.<run number>, e.g. 2026.10.1.7
# The run number also becomes the Android versionCode, so every release upgrades cleanly.

on:
  workflow_dispatch:
    inputs:
      version_prefix:
        description: 'Version prefix (year.month.patch). Leave empty to use the current year.month.1'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign & publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute version
        id: version
        env:
          PREFIX_INPUT: ${{ inputs.version_prefix }}
        run: |
          PREFIX="$PREFIX_INPUT"
          if [ -z "$PREFIX" ]; then
            PREFIX="$(date -u +%Y).$(date -u +%-m).1"
          fi
          if ! echo "$PREFIX" | grep -Eq '^[0-9]{4}\.[0-9]{1,2}\.[0-9]+$'; then
            echo "::error::version_prefix must look like 2026.10.1 (got '$PREFIX')"
            exit 1
          fi
          VERSION_NAME="${PREFIX}.${{ github.run_number }}"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION_NAME (versionCode ${{ github.run_number }})"

      - name: Prepare environment files
        run: |
          [ -f .env ] || cp .env.example .env

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing signing secrets. Set KEYSTORE_BASE64, STORE_PASSWORD and KEY_PASSWORD in Settings > Secrets and variables > Actions."
            exit 1
          fi
          KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build signed APK and App Bundle
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Collect release files
        id: files
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          AAB=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -z "$APK" ] || [ -z "$AAB" ]; then
            echo "::error::Release outputs not found"
            exit 1
          fi
          cp "$APK" "dist/uthoSajib-${VERSION_NAME}.apk"
          cp "$AAB" "dist/uthoSajib-${VERSION_NAME}.aab"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uthoSajib-${{ steps.version.outputs.name }}
          path: dist/
          retention-days: 30

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: uthoSajib ${{ steps.version.outputs.name }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            ## Install
            1. Download **uthoSajib-${{ steps.version.outputs.name }}.apk** below on your Android phone (Android 7.0+).
            2. Open it and allow installing from this source if Android asks.
            3. On first launch, allow notifications and exact alarms so alarms can ring on time.

            The `.aab` file is for Google Play distribution.
          files: |
            dist/uthoSajib-${{ steps.version.outputs.name }}.apk
            dist/uthoSajib-${{ steps.version.outputs.name }}.aab

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
